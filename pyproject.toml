[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-content-radar"
version = "0.2.0"
description = "Headless email-first competitor content radar MVP"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "python-dateutil>=2.9,<3",
  "typer>=0.12,<1",
  "rich>=13,<14",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-httpx>=0.30,<1"]

[project.scripts]
radar = "radar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that access public websites", "powershell: tests that require PowerShell", "docker: tests that require Docker"]
addopts = "-q"
